name: Changed-code checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: astra_test
          POSTGRES_PASSWORD: astra-local-test-only
          POSTGRES_DB: astra_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U astra_test -d astra_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://astra_test:astra-local-test-only@127.0.0.1:55432/astra_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Check changed code
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec vitest run --changed "$BASE_SHA"
      - name: Foundation smoke (manual)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm exec vitest run tests/tasks/T01.test.ts
