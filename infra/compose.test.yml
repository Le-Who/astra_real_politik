services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: astra_test
      POSTGRES_PASSWORD: astra-local-test-only
      POSTGRES_DB: astra_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra_test -d astra_test"]
      interval: 2s
      timeout: 3s
      retries: 20
